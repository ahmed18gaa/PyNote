name: Build PyNote for Windows

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-windows:
    name: Build PyNote.exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install wxPython==4.3.1

      - name: Build PyNote
        run: |
          pyinstaller --windowed --name "PyNote" --icon "PyNote.ico" --clean --noconfirm pyNote.py

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PyNote-1.0.1-Windows
          path: dist/PyNote/
